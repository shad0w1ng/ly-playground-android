name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像自带 Android SDK（ANDROID_HOME 与 cmdline-tools 均已就绪），
      # 不再用 android-actions/setup-android，避免它在镜像上重复安装失败。
      - name: Android SDK info
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          command -v sdkmanager || true
          sdkmanager --list_installed 2>/dev/null | head -25 || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # 手动取 Gradle 发行版，不依赖第三方 action，链路更短
      - name: Install Gradle 8.7
        run: |
          curl -sSLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"
          "$HOME/gradle-8.7/bin/gradle" --version

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      - name: Verify APK
        run: |
          set -e
          mkdir -p out
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$APK" out/
          SIZE=$(du -h "$APK" | cut -f1)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | head -1)
          if [ -n "$AAPT" ]; then
            BADGING=$("$AAPT" dump badging "$APK" 2>/dev/null | head -8 || echo "aapt2 无输出")
          else
            BADGING="aapt2 不存在，跳过"
          fi
          ENTRIES=$(unzip -l "$APK" | grep -E "assets/skin/chat\.(css|js)|classes\.dex|resources\.arsc|AndroidManifest\.xml" || true)
          {
            echo "自动构建产物（debug 包，调试密钥签名，仅供安装测试）"
            echo ""
            echo "- 文件：$(basename "$APK")"
            echo "- 体积：$SIZE"
            echo "- SHA256：\`$SHA\`"
            echo ""
            echo "<details><summary>aapt2 badging</summary>"
            echo ""
            echo '```'
            echo "$BADGING"
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>关键条目</summary>"
            echo ""
            echo '```'
            echo "$ENTRIES"
            echo '```'
            echo "</details>"
          } > out/report.md
          cat out/report.md

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=latest-build
          APK=$(ls out/*.apk | head -1)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes-file out/report.md
          else
            gh release create "$TAG" "$APK" \
              --title "最新构建" \
              --notes-file out/report.md \
              --latest
          fi
          gh release view "$TAG" --json url,assets --template '{{.url}}{{"\n"}}{{range .assets}}{{.name}} {{.size}}{{"\n"}}{{end}}'

      # 失败时把日志写回仓库，便于在没有 API 权限的环境里定位问题
      - name: Dump failure log
        if: failure()
        run: |
          mkdir -p ci
          {
            echo "# 环境"
            java -version 2>&1 || true
            echo
            echo "# Android SDK"
            ls "${ANDROID_HOME}/platforms" 2>&1 || true
            echo
            echo "# 日志尾部"
            tail -400 build.log 2>/dev/null || echo "无 build.log"
          } > ci/last-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/last-failure.log
          git commit -m "ci: 记录失败日志 [skip ci]" || true
          git push || true
